name: stoa
version: 0.12.0
manifest_version: 2
api_version: 1
description: >-
  A go-to-market desk for small teams: map a market, find the leads, run the pipeline. Market maps
  that turn into leads with one click, a SQLite pipeline, playbooks that fit it to any niche, a
  live pane beside the chat in the Desktop app and Webapp, Slack cards whose buttons move a stage
  at once and hand the writing to Hermes, and meeting notes that become next steps.
author: jarrett-del
license: MIT
homepage: https://github.com/jarrett-del/hermes-stoa
requires_hermes: ">=0.23.0"
tags: [gtm, sales, crm, recruiting, slack, pipeline]

provides_tools:
  - gtm_pipeline
  - gtm_deal
  - gtm_card
  - gtm_market
  - gtm_enrich
  - gtm_notes
  - gtm_playbook
  - gtm_export
  - gtm_intake
  - gtm_contact

config_schema:
  playbook:
    type: str
    default: b2b-sales
    label: Playbook
    description: "Which playbook the desk runs on: b2b-sales, recruiting, agency, partnerships, or one you saved."
  channels:
    type: list
    default: []
    label: Limit to these chats
    description: "Chat ids (for example Slack channel ids) where the desk is available. Empty means everywhere. Terminal and Desktop sessions are always allowed; add the word cron to let scheduled jobs use it too."
  slack_users:
    type: list
    default: []
    label: Who may press Slack buttons
    description: "Slack user ids (they start with U) who may press the buttons on any card, review or map. Empty means only the person a card was posted for can press its buttons."
  import_dir:
    type: str
    default: ""
    label: Import folder
    description: "A folder the agent may read CSV files from by path, besides the plugin's own imports folder and the working directory. Optional."
  notes_dir:
    type: str
    default: ""
    label: Meeting notes folder
    description: "A folder of Markdown or text call notes to watch (an Obsidian folder, a recorder's export folder). Optional."
  notes_days:
    type: int
    default: 7
    label: Notes look-back (days)
    description: "How far back the notes inbox looks."
  pdl_monthly_cap:
    type: int
    default: 50
    label: Enrichment cap per month
    description: "Most People Data Labs lookups the desk will pay for in a calendar month. 0 means no cap."
  pdl_api_key:
    type: secret
    env: PDL_API_KEY
    label: People Data Labs API key
    description: "Optional. Turns on the Enrich button and gtm_enrich."
  exa_api_key:
    type: secret
    env: EXA_API_KEY
    label: Exa API key
    description: "Optional. Lets the market map search for companies directly; without it the agent uses its own web search."
  granola_api_key:
    type: secret
    env: GRANOLA_API_KEY
    label: Granola API key
    description: "Optional. Adds your Granola call notes to the notes inbox."
